apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: carsties-gateway
  namespace: default
spec:
  gatewayClassName: traefik

  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: carsties-tls
      allowedRoutes:
        namespaces:
          from: Same
  
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same