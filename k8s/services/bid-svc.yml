apiVersion: apps/v1
kind: Deployment
metadata:
  name: bid-svc
  labels:
    app: bid-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bid-svc
  template:
    metadata:
      name: bid-svc
      labels:
        app: bid-svc
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: [ "sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done" ]
        - name: wait-for-rabbitmw
          image: busybox
          command: [ "sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done" ]
      containers:
        - name: bid-svc
          image: trycatchlearn/bid-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: http://+:80
            - name: RabbitMQ__Host
              value: rabbitmq
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  key: rabbitmq-user
                  name: carsties-secrets
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  key: rabbitmq-password
                  name: carsties-secrets
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: postgres-password
                  name: carsties-secrets
            - name: ConnectionStrings__BidDbConnection
              value: Server=postgres:5432;User Id=postgres;Password=$(POSTGRES_PASSWORD);Database=bids
            - name: IdentityServiceUrl
              value: http://identity-svc
            - name: GrpcAuctionServiceUrl
              value: http://auction-svc:81
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: bid-svc
spec:
  selector:
    app: bid-svc
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP