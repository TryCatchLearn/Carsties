name: Docker

on:
  workflow_call: 
    inputs: 
      image:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      test_project:
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}/${{inputs.image}}

jobs:
  test:
    if: inputs.test_project != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up .Net
        uses: actions/setup-dotnet@v6
        with: 
          dotnet-version: "10.0.x"
          
      - name: dotnet test
        run: dotnet test "${{inputs.test_project}}" --configuration Release
  
  build:
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs: 
      image_tags: ${{steps.meta.outputs.tags}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            latest

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{inputs.context}}
          push: true
          file: ${{inputs.dockerfile}}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{env.IMAGE_NAME}}
          cache-to: type=gha,mode=max,scope=${{env.IMAGE_NAME}}

  deploy:
    needs: [build, test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{secrets.DIGITAL_OCEAN_TOKEN}}
          
      - name: Save digital ocean kubeconfig
        run: doctl kubernetes cluster kubeconfig save carsties
      
      - name: Apply manifest with sha tag
        run: |
          IMAGE=$(echo "${{needs.build.outputs.image_tags}}" | grep ':sha-')
          yq eval '(
            select(.kind == "Deployment")
            | .spec.template.spec.containers[]
            | select(.name == "${{inputs.image}}")
          ).image = "'"$IMAGE"'"' \
          k8s/services/${{inputs.image}}.yml \
          | kubectl apply -f -